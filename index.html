<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <header class ="header">
    <h1>STUDENT EXPENSE TRACKER</h1>
     
    <p class="subtitle">CHALO KARCHA PTA KARE</p>
    </header>

   <section class="total-card">
      <h2>KUL KARCHA : <span id="total-amount">₹0.00</span></h2>
    </section>
    <section class="form-section">
      <form id="expense-form">
        <div class="form-group">
          <label for="expense-name">KIDHAR HUA</label>
          <input type="text" id="expense-name" placeholder="e.g., Notebook">
        </div>
        <div class="form-group">
          <label for="expense-amount">KITNA UDAYA(₹)</label>
          <input type="number" id="expense-amount" placeholder="e.g., 10" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label for="expense-category">Category</label>
          <select id="expense-category">
            <option value="Food">KHANA</option>
            <option value="Travel">GHUMNA</option>
            <option value="Shopping">KHARIDARI</option>
            <option value="Education">PADHAI</option>
            <option value="Other">BAS GALTI SE HOGYA</option>
          </select>
          <button type="submit" id="add-btn">KHARCHA JODE</button>
      </form>
    </section>
    <section class="list-section">
      <div class="list-header">
        <h3>KHARCHA</h3>
        <div class="filter-group">
          <label for="filter-category">Filter:</label>
          <select id="filter-category">
            <option value="All">All Categories</option>
            <option value="KHANA"></option>
            <option value="JHUMNA">Travel</option>
            <option value="KHARIDARI">Shopping</option>
            <option value="PADHAI">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <section class="category-summary-section">
      <h3>Expenses by Category</h3>
      <div class="category-cards">
        <div class="cat-card cat-food">
          <span class="cat-title">KHANA</span>
          <span class="cat-amount" id="total-food">₹0.00</span>
        </div>
        <div class="cat-card cat-travel">
          <span class="cat-title">GHUMNA</span>
          <span class="cat-amount" id="total-travel">₹0.00</span>
        </div>
        <div class="cat-card cat-shopping">
          <span class="cat-title">KHARIDARI</span>
          <span class="cat-amount" id="total-shopping">₹0.00</span>
        </div>
        <div class="cat-card cat-education">
          <span class="cat-title">PADHAI</span>
          <span class="cat-amount" id="total-education">₹0.00</span>
        </div>
        <div class="cat-card cat-other">
          <span class="cat-title">BAS GALTI SE HOGYA</span>
          <span class="cat-amount" id="total-other">₹0.00</span>
        </div>
      </div>
    </section>
      <ul id="expense-list" class="expense-list"></ul>
      <p id="empty-message" class="empty-message">##AAJ BCHAYEGA TO KAL KHAYERGA##</p>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>

</body>
</html>
